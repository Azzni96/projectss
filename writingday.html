<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Journal (Protected)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      transition: background 0.5s, color 0.5s;
    }

    .dark-mode {
      background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%);
      color: white;
    }

    h1 { font-size: 2.5rem; margin-bottom: 20px; }
    h2 { margin-bottom: 10px; font-size: 1.5rem; }

    .container, .login-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 700px;
      text-align: center;
      transition: background 0.5s, color 0.5s;
    }

    .dark-mode .container, .dark-mode .login-container {
      background: #34495e;
      color: white;
    }

    textarea, input[type="password"] {
      width: 100%;
      margin-bottom: 20px;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
      transition: border-color 0.3s;
    }

    textarea:focus, input[type="password"]:focus {
      border-color: #74ebd5;
      outline: none;
    }

    .dark-mode textarea, .dark-mode input[type="password"] {
      background-color: #2c3e50;
      color: white;
      border: 1px solid #555;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
      justify-content: center;
    }

    button {
      flex: 1;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    .save-btn { background-color: #4CAF50; color: white; }
    .save-btn:hover { background-color: #45a049; transform: scale(1.05); }
    .show-btn { background-color: #2196F3; color: white; }
    .show-btn:hover { background-color: #1976D2; transform: scale(1.05); }
    .download-btn { background-color: #ff9800; color: white; }
    .download-btn:hover { background-color: #fb8c00; transform: scale(1.05); }
    .changename-btn { background-color: #6a1b9a; color: white; }
    .changename-btn:hover { background-color: #4a148c; transform: scale(1.05); }
    .logout-btn { background-color: #e53935; color: white; }
    .logout-btn:hover { background-color: #d32f2f; transform: scale(1.05); }

    /* Upload label styled as button */
    .upload-label {
      background-color: #9c27b0;
      color: white;
      display: inline-block;
      padding: 15px 30px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      transition: background-color 0.3s, transform 0.2s;
      user-select: none;
      overflow: hidden;
    }
    .upload-label:hover {
      background-color: #7b1fa2;
      transform: scale(1.05);
    }
    .upload-label input[type="file"] {
      display: none;
    }

    .message { margin: 20px 0; font-weight: bold; }
    .old-entries { margin-top: 30px; }

    .entry {
      background-color: #fafafa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      text-align: left;
      transition: background 0.5s, color 0.5s;
    }
    .dark-mode .entry {
      background-color: #3d566e;
      color: white;
    }

    .toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .toggle-btn:hover { background-color: #555; }

    /* Animations */
    #login, #journal {
      opacity: 0;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      visibility: hidden;
    }
    #login.show, #journal.show {
      opacity: 1;
      visibility: visible;
    }

    /* Loading Spinner */
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container, .login-container { width: 90%; padding: 20px; }
      textarea, input[type="password"] { font-size: 14px; padding: 12px; }
      .buttons { flex-direction: column; }
      button, .upload-label { width: 100%; font-size: 16px; padding: 12px; }
      .toggle-btn { top: 10px; right: 10px; padding: 8px 16px; font-size: 14px; }
      h1 { font-size: 2rem; }
      h2 { font-size: 1.2rem; }
      .entry { padding: 15px; }
    }
  </style>
</head>

<body>
<!-- Loading Screen -->
<div id="loading">
    <div class="spinner"></div>
  </div>
  
  <!-- Toggle Dark Mode Button -->
  <button class="toggle-btn" onclick="toggleDarkMode()">🌗</button>
  
  <!-- Login Page -->
  <div id="login" class="login-container">
    <h1>Enter Password</h1>
    <input type="password" id="password" placeholder="Password...">
    <div class="buttons">
      <button class="save-btn" onclick="checkPassword()">Login</button>
      <button class="save-btn" onclick="changePassword()">Change Password</button>
    </div>
  </div>
  
  <!-- Journal Page -->
  <div id="journal">
    <h1>Daily Journal</h1>
    <h2 id="welcome-message"></h2>
    <div class="container">
      <h2>🌟 Positive Things</h2>
      <textarea id="positive" placeholder="Write positive things..."></textarea>
  
      <h2>🌧️ Negative Things</h2>
      <textarea id="negative" placeholder="Write challenges..."></textarea>
  
      <div class="buttons">
        <button class="save-btn" onclick="saveDay()">Save Today</button>
        <button class="show-btn" onclick="showOldDays()">Show Previous Days</button>
        <button class="download-btn" onclick="downloadAll()">Download Backup</button>
        
        <!-- Upload Button (new professional style) -->
        <label class="upload-label">
          📁 Upload Backup
          <input type="file" id="file-upload" accept=".txt" onchange="uploadBackup()">
        </label>
      </div>
  
      <div class="buttons">
        <button class="changename-btn" onclick="changeName()">Change Name</button>
        <button class="logout-btn" onclick="logoutNow()">Logout Now</button>
      </div>
  
      <div class="message" id="message"></div>
      <div class="old-entries" id="oldEntries"></div>
    </div>
  </div>
  
  <!-- JavaScript -->
  <script>
  function encrypt(text) { return btoa(text); }
  function decrypt(encoded) { return atob(encoded); }
  
  const defaultPassword = "1234";
  if (!localStorage.getItem('journalPassword')) {
    localStorage.setItem('journalPassword', encrypt(defaultPassword));
    const userName = prompt("Welcome! Please enter your name:");
    if (userName && userName.trim() !== "") {
      localStorage.setItem('userName', userName.trim());
    } else {
      localStorage.setItem('userName', "User");
    }
  }
  
  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
  }
  
  function checkPassword() {
    const enteredPassword = document.getElementById('password').value;
    const encryptedPassword = localStorage.getItem('journalPassword');
    const realPassword = decrypt(encryptedPassword);
  
    if (enteredPassword === realPassword) {
      sessionStorage.setItem('loggedIn', 'true');
      document.getElementById('login').classList.remove('show');
      setTimeout(() => {
        document.getElementById('login').style.display = 'none';
        document.getElementById('journal').style.display = 'block';
        setTimeout(() => document.getElementById('journal').classList.add('show'), 10);
        showWelcomeMessage();
      }, 800);
    } else {
      alert('Wrong password. Try again.');
    }
  }
  
  function changePassword() {
    const currentPassword = prompt("Enter your current password:");
    const encryptedPassword = localStorage.getItem('journalPassword');
    const realPassword = decrypt(encryptedPassword);
  
    if (currentPassword !== realPassword) {
      alert("Wrong current password.");
      return;
    }
  
    const newPassword = prompt("Enter your new password:");
    if (!newPassword || newPassword.length < 3) {
      alert("Password must be at least 3 characters.");
      return;
    }
  
    localStorage.setItem('journalPassword', encrypt(newPassword));
    alert("Password changed successfully! 🔐");
  }
  
  function showWelcomeMessage() {
    const userName = localStorage.getItem('userName') || "User";
    document.getElementById('welcome-message').textContent = `Welcome, ${userName}! 🎉`;
  }
  
  function changeName() {
    const newName = prompt("Enter your new name:");
    if (newName && newName.trim() !== "") {
      localStorage.setItem('userName', newName.trim());
      showWelcomeMessage();
      alert("Name changed successfully! 🎉");
    } else {
      alert("Name cannot be empty!");
    }
  }
  
  function saveDay() {
    const positive = document.getElementById('positive').value;
    const negative = document.getElementById('negative').value;
    const today = new Date().toLocaleDateString();
  
    const dayData = { positive, negative };
    localStorage.setItem('day-' + today, JSON.stringify(dayData));
  
    document.getElementById('message').textContent = 'Your day was saved successfully! ✅';
    document.getElementById('positive').value = '';
    document.getElementById('negative').value = '';
  }
  
  function showOldDays() {
    const oldEntriesDiv = document.getElementById('oldEntries');
    oldEntriesDiv.innerHTML = '';
  
    const keys = Object.keys(localStorage).filter(key => key.startsWith('day-'));
    if (keys.length === 0) {
      oldEntriesDiv.innerHTML = '<p>No saved days yet.</p>';
      return;
    }
  
    keys.forEach(key => {
      const data = JSON.parse(localStorage.getItem(key));
      const entryDiv = document.createElement('div');
      entryDiv.className = 'entry';
      entryDiv.innerHTML = `
        <h3>🗓️ ${key.replace('day-', '')}</h3>
        <p><strong>Positive:</strong> ${data.positive}</p>
        <p><strong>Negative:</strong> ${data.negative}</p>
        <button class="delete-btn" onclick="deleteDay('${key}')">Delete This Day</button>
      `;
      oldEntriesDiv.appendChild(entryDiv);
    });
  }
  
  function deleteDay(key) {
    if (confirm('Are you sure you want to delete this day?')) {
      localStorage.removeItem(key);
      showOldDays();
    }
  }
  
  function downloadAll() {
    const keys = Object.keys(localStorage).filter(key => key.startsWith('day-'));
    if (keys.length === 0) {
      alert('No saved days to download.');
      return;
    }
  
    let textContent = "";
    keys.forEach(key => {
      const data = JSON.parse(localStorage.getItem(key));
      textContent += `Date: ${key.replace('day-', '')}\n`;
      textContent += `Positive: ${data.positive}\n`;
      textContent += `Negative: ${data.negative}\n`;
      textContent += `------------------------------\n`;
    });
  
    const blob = new Blob([textContent], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'daily-journal.txt';
    a.click();
    URL.revokeObjectURL(url);
  }
  
  function uploadBackup() {
    const fileInput = document.getElementById('file-upload');
    const file = fileInput.files[0];
  
    if (!file) {
      alert('Please select a file.');
      return;
    }
  
    const reader = new FileReader();
    reader.onload = function(event) {
      const text = event.target.result;
      const entries = text.split('------------------------------\n').filter(e => e.trim() !== '');
  
      entries.forEach(entry => {
        const dateMatch = entry.match(/Date: (.+)/);
        const positiveMatch = entry.match(/Positive: (.+)/);
        const negativeMatch = entry.match(/Negative: (.+)/);
  
        if (dateMatch && positiveMatch && negativeMatch) {
          const date = dateMatch[1];
          const positive = positiveMatch[1];
          const negative = negativeMatch[1];
          const dayData = { positive, negative };
          localStorage.setItem('day-' + date, JSON.stringify(dayData));
        }
      });
  
      alert('Backup uploaded successfully! ✅');
      showOldDays();
    };
    reader.readAsText(file);
  }
  
  function logoutNow() {
    if (confirm("Are you sure you want to logout now?")) {
      sessionStorage.removeItem('loggedIn');
      document.getElementById('journal').style.display = 'none';
      document.getElementById('login').style.display = 'block';
      document.getElementById('login').classList.add('show');
    }
  }
  
  let inactivityTime = function() {
    let time;
    function resetTimer() {
      clearTimeout(time);
      time = setTimeout(logout, 5 * 60 * 1000);
    }
    function logout() {
      alert("You were inactive for 5 minutes. You are logged out.");
      sessionStorage.removeItem('loggedIn');
      document.getElementById('journal').style.display = 'none';
      document.getElementById('login').style.display = 'block';
      document.getElementById('login').classList.add('show');
    }
    document.onmousemove = resetTimer;
    document.onkeypress = resetTimer;
    document.onclick = resetTimer;
    document.onscroll = resetTimer;
  };
  
  window.onload = function() {
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      if (sessionStorage.getItem('loggedIn') === 'true') {
        document.getElementById('journal').style.display = 'block';
        document.getElementById('journal').classList.add('show');
        showWelcomeMessage();
      } else {
        document.getElementById('login').style.display = 'block';
        document.getElementById('login').classList.add('show');
      }
      inactivityTime();
    }, 2000);
  };
  </script>
  
  </body>
  </html>
